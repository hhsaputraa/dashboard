name: Build Android APK & iOS IPA

on:
  push:
    branches: [ main, master, dev ]
  workflow_dispatch: # Memungkinkan tombol "Run workflow" manual di tab GitHub Actions

env:
  # Menghilangkan warning deprecation Node.js 20 yang dipaksa ke Node.js 24
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE20: true

jobs:
  # -------------------------------------------------------------
  # 1. BUILD ANDROID APK
  # -------------------------------------------------------------
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Create .env.json from GitHub Secrets
        env:
          API_BASE_URL: ${{ secrets.API_BASE_URL }}
          AES_KEY: ${{ secrets.AES_KEY }}
        run: |
          echo "{\"API_BASE_URL\":\"$API_BASE_URL\",\"AES_KEY\":\"$AES_KEY\"}" > .env.json

      - name: Build Obfuscated Release APK (Split ABI)
        run: |
          flutter build apk --release \
            --split-per-abi \
            --obfuscate \
            --split-debug-info=build/app/outputs/symbols \
            --dart-define-from-file=.env.json

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BPR-SUPRA-Android-APK
          path: build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error

  # -------------------------------------------------------------
  # 2. BUILD iOS IPA (Officially Signed with APNs Entitlements)
  # -------------------------------------------------------------
  build-ios:
    name: Build iOS IPA
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Create .env.json from GitHub Secrets
        env:
          API_BASE_URL: ${{ secrets.API_BASE_URL }}
          AES_KEY: ${{ secrets.AES_KEY }}
        run: |
          echo "{\"API_BASE_URL\":\"$API_BASE_URL\",\"AES_KEY\":\"$AES_KEY\"}" > .env.json

      - name: Install Apple Certificate & Provisioning Profile
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.BUILD_PROVISION_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          CERTIFICATE_PATH=$RUNNER_TEMP/build_certificate.p12
          PP_PATH=$RUNNER_TEMP/build_pp.mobileprovision
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db

          # Decode certificate and provisioning profile
          echo -n "$BUILD_CERTIFICATE_BASE64" | base64 --decode -o $CERTIFICATE_PATH
          echo -n "$BUILD_PROVISION_PROFILE_BASE64" | base64 --decode -o $PP_PATH

          # Create and configure temporary keychain
          security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH

          # Import certificate into keychain
          security import $CERTIFICATE_PATH -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k $KEYCHAIN_PATH
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security list-keychains -d user -s $KEYCHAIN_PATH $(security list-keychains -d user | tr -d '"')

          # Install provisioning profile
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          UUID=$(grep -A1 -a "UUID" $PP_PATH | grep -a "<string>" | sed -e 's/.*<string>//' -e 's/<\/string>.*//')
          cp $PP_PATH ~/Library/MobileDevice/Provisioning\ Profiles/$UUID.mobileprovision

      - name: Build iOS App
        run: |
          flutter build ios --release --no-codesign \
            --obfuscate \
            --split-debug-info=build/app/outputs/symbols \
            --dart-define-from-file=.env.json

      - name: Officially CodeSign with APNs Entitlements & Package IPA
        env:
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          PP_PATH=$RUNNER_TEMP/build_pp.mobileprovision
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          APP_PATH=build/ios/iphoneos/Runner.app

          # Unlock keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH

          # Extract signing identity
          SIGNING_IDENTITY=$(security find-identity -v -p codesigning $KEYCHAIN_PATH | head -n 1 | awk -F'"' '{print $2}')
          echo "Using Signing Identity: $SIGNING_IDENTITY"

          # Extract entitlements directly from Provisioning Profile to guarantee 100% APNs match
          security cms -D -i $PP_PATH > $RUNNER_TEMP/provision.plist
          /usr/libexec/PlistBuddy -x -c 'Print :Entitlements' $RUNNER_TEMP/provision.plist > $RUNNER_TEMP/entitlements.plist

          # Copy embedded.mobileprovision to app bundle
          cp $PP_PATH "$APP_PATH/embedded.mobileprovision"

          # Sign all embedded frameworks
          if [ -d "$APP_PATH/Frameworks" ]; then
            for framework in "$APP_PATH/Frameworks"/*; do
              if [ -d "$framework" ] || [ -f "$framework" ]; then
                codesign --force --verify --verbose --sign "$SIGNING_IDENTITY" --keychain $KEYCHAIN_PATH "$framework"
              fi
            done
          fi

          # Sign the main executable with the exact APNs entitlements
          codesign --force --verify --verbose --sign "$SIGNING_IDENTITY" --keychain $KEYCHAIN_PATH --entitlements $RUNNER_TEMP/entitlements.plist "$APP_PATH"

          # Verify signature & entitlements
          codesign -d --entitlements :- "$APP_PATH"

          # Package into IPA
          cd build/ios/iphoneos
          mkdir -p Payload
          cp -r Runner.app Payload/
          zip -r -q BPR-SUPRA-iOS.ipa Payload/

      - name: Upload iOS IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BPR-SUPRA-iOS-IPA
          path: build/ios/iphoneos/BPR-SUPRA-iOS.ipa
          if-no-files-found: error
