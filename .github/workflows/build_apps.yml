name: Build Android APK & iOS IPA

on:
  push:
    branches: [ main, master, dev ]
  workflow_dispatch: # Memungkinkan tombol "Run workflow" manual di tab GitHub Actions

jobs:
  # -------------------------------------------------------------
  # 1. BUILD ANDROID APK
  # -------------------------------------------------------------
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Ensure .env.json exists
        run: |
          if [ ! -f .env.json ]; then
            echo '{"API_BASE_URL":"http://localhost:8097","AES_KEY":"f17ba46472fa64e40ca496d1b4c91e8f"}' > .env.json
          fi

      - name: 🔨 Build Release APK
        run: |
          flutter build apk --release --dart-define-from-file=.env.json

      - name: 📤 Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BPR-SUPRA-Android-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

  # -------------------------------------------------------------
  # 2. BUILD iOS IPA (Unsigned / Direct Sideload Ready)
  # -------------------------------------------------------------
  build-ios:
    name: Build iOS IPA
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Ensure .env.json exists
        run: |
          if [ ! -f .env.json ]; then
            echo '{"API_BASE_URL":"http://localhost:8097","AES_KEY":"f17ba46472fa64e40ca496d1b4c91e8f"}' > .env.json
          fi

      - name: Build iOS (No Codesign)
        run: |
          flutter build ios --release --no-codesign --dart-define-from-file=.env.json

      - name: Package into .IPA (Payload structure)
        run: |
          cd build/ios/iphoneos
          mkdir Payload
          cp -r Runner.app Payload/
          zip -r BPR-SUPRA-iOS.ipa Payload/

      - name: Upload iOS IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BPR-SUPRA-iOS-IPA
          path: build/ios/iphoneos/BPR-SUPRA-iOS.ipa
          if-no-files-found: error
