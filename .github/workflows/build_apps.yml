name: Build Android APK & iOS IPA

on:
  push:
    branches: [ main, master, dev ]
  workflow_dispatch: # Memungkinkan tombol "Run workflow" manual di tab GitHub Actions

env:
  # Menghilangkan warning deprecation Node.js 20 yang dipaksa ke Node.js 24
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE20: true

jobs:
  # -------------------------------------------------------------
  # 1. BUILD ANDROID APK
  # -------------------------------------------------------------
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Create .env.json from GitHub Secrets
        env:
          API_BASE_URL: ${{ secrets.API_BASE_URL }}
          AES_KEY: ${{ secrets.AES_KEY }}
        run: |
          echo "{\"API_BASE_URL\":\"$API_BASE_URL\",\"AES_KEY\":\"$AES_KEY\"}" > .env.json

      - name: Build Obfuscated Release APK (Split ABI)
        run: |
          flutter build apk --release \
            --split-per-abi \
            --obfuscate \
            --split-debug-info=build/app/outputs/symbols \
            --dart-define-from-file=.env.json

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BPR-SUPRA-Android-APK
          path: build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error

  # -------------------------------------------------------------
  # 2. BUILD iOS IPA (Unsigned / Direct Sideload Ready)
  # -------------------------------------------------------------
  build-ios:
    name: Build iOS IPA
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Create .env.json from GitHub Secrets
        env:
          API_BASE_URL: ${{ secrets.API_BASE_URL }}
          AES_KEY: ${{ secrets.AES_KEY }}
        run: |
          echo "{\"API_BASE_URL\":\"$API_BASE_URL\",\"AES_KEY\":\"$AES_KEY\"}" > .env.json

      - name: Build Obfuscated iOS (No Codesign)
        run: |
          flutter build ios --release --no-codesign \
            --obfuscate \
            --split-debug-info=build/app/outputs/symbols \
            --dart-define-from-file=.env.json

      - name: Sign and Package into .IPA
        env:
          P12_BASE64: ${{ secrets.P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          PROVISION_BASE64: ${{ secrets.PROVISION_BASE64 }}
        run: |
          cd build/ios/iphoneos
          cp -f "$GITHUB_WORKSPACE/ios/Runner/GoogleService-Info.plist" Runner.app/GoogleService-Info.plist || true

          if [ -n "$P12_BASE64" ] && [ -n "$PROVISION_BASE64" ]; then
            echo "Signing with Apple Developer Certificate on macOS..."
            KEYCHAIN_PATH=$RUNNER_TEMP/build.keychain
            KEYCHAIN_PASSWORD=$(openssl rand -base64 12)
            security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
            security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
            security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

            echo "$P12_BASE64" | base64 --decode > $RUNNER_TEMP/cert.p12
            security import $RUNNER_TEMP/cert.p12 -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
            security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
            security list-keychain -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | tr -d '"')

            SIGNING_IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" | grep -m 1 -o '".*"' | tr -d '"')
            echo "Detected Signing Identity: $SIGNING_IDENTITY"

            mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
            echo "$PROVISION_BASE64" | base64 --decode > ~/Library/MobileDevice/Provisioning\ Profiles/profile.mobileprovision
            cp ~/Library/MobileDevice/Provisioning\ Profiles/profile.mobileprovision Runner.app/embedded.mobileprovision

            echo "=== Extracting Entitlements from Provisioning Profile ==="
            security cms -D -i Runner.app/embedded.mobileprovision > provision.plist || true
            if [ -f "provision.plist" ]; then
              /usr/libexec/PlistBuddy -x -c 'Print :Entitlements' provision.plist > entitlements.plist || true
            fi

            ENTITLEMENTS_FILE="entitlements.plist"
            if [ ! -s "$ENTITLEMENTS_FILE" ]; then
              echo "Using repository Runner.entitlements fallback"
              ENTITLEMENTS_FILE="$GITHUB_WORKSPACE/ios/Runner/Runner.entitlements"
            fi
            echo "Using Entitlements:"
            cat "$ENTITLEMENTS_FILE"

            if [ -d "Runner.app/Frameworks" ]; then
              for f in Runner.app/Frameworks/*; do
                if [ -e "$f" ]; then
                  codesign --force --sign "$SIGNING_IDENTITY" --keychain "$KEYCHAIN_PATH" --generate-entitlement-der "$f" || true
                fi
              done
            fi

            codesign --force --generate-entitlement-der \
              --sign "$SIGNING_IDENTITY" \
              --entitlements "$ENTITLEMENTS_FILE" \
              --keychain "$KEYCHAIN_PATH" \
              Runner.app

            echo "=== Verifying Code Signature ==="
            codesign -dvvvv Runner.app
            codesign --verify --deep --strict --verbose=2 Runner.app
            echo "Codesign completed successfully!"
          else
            echo "Secrets not provided, packaging unsigned IPA."
          fi

          mkdir Payload
          cp -r Runner.app Payload/
          zip -r BPR-SUPRA-iOS.ipa Payload/

      - name: Upload iOS IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BPR-SUPRA-iOS-IPA
          path: build/ios/iphoneos/BPR-SUPRA-iOS.ipa
          if-no-files-found: error
